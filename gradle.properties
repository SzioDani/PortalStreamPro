# ========================================
# AndroidX Configuration
# ========================================
android.useAndroidX=true
android.enableJetifier=true

# ========================================
# JVM e Memoria
# ========================================
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=8

# ========================================
# Android Build Configuration
# ========================================
android.buildToolsVersion=34.0.0

# Disabilita NDK problematico su GitHub Actions
android.useDeprecatedNdk=false

# ========================================
# Kotlin Configuration
# ========================================
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=false
kotlin.stdlib.default.name=stdlib
kotlin.stdlib.jdk.variants=true

# ========================================
# Compose Configuration
# ========================================
android.defaults.buildfeatures.compose=true
android.defaults.buildfeatures.buildconfig=true

# ========================================
# Build Features
# ========================================
android.databinding.enableV2=true
android.view.excludeClasses=android.view.View

# ========================================
# Performance & Optimization
# ========================================
android.enableAapt2=true
android.enableDexingArtifactTransform=true
org.gradle.configuration.cache=true
org.gradle.configuration.cache.problems=warn

# ========================================
# Debug Configuration per GitHub Actions
# ========================================
android.debug.obsoleteApi=false
android.disableResourceValidation=false
