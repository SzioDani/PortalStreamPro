name: ðŸŽ¨ Crea Risorse Android Mancanti

on: workflow_dispatch

jobs:
  crea-risorse:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Crea cartelle e file XML
      run: |
        # Crea le cartelle necessarie
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/mipmap
        
        # 1. Crea il file dei Testi (app_name)
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">PortalStream Pro</string>
        </resources>
        EOF
        
        # 2. Crea il file del Tema e Colori
        cat << 'EOF' > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.PortalStreamPro" parent="Theme.AppCompat.DayNight.DarkActionBar">
                <item name="colorPrimary">#6200EE</item>
                <item name="colorPrimaryDark">#3700B3</item>
                <item name="colorAccent">#03DAC5</item>
            </style>
        </resources>
        EOF
        
        # 3. Crea le regole di backup (richieste da Android 12+)
        cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <full-backup-content>
            <include domain="sharedpref" path="."/>
        </full-backup-content>
        EOF
        
        cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <data-extraction-rules>
            <cloud-backup>
                <include domain="sharedpref" path="."/>
            </cloud-backup>
        </data-extraction-rules>
        EOF
        
        # 4. Crea un'icona base temporanea sia in drawable che in mipmap
        mkdir -p app/src/main/res/drawable
        
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#263238" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#00E676" android:pathData="M54,20L20,80h68z"/>
        </vector>
        EOF
        
        # Copia l'icona anche in mipmap
        cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/mipmap/ic_launcher.xml
        cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/mipmap/ic_launcher_round.xml

    - name: Salva i file nel progetto
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add app/src/main/res/
        git commit -m "Auto-generato risorse UI mancanti (Theme, Strings, Icon)"
        git push
        
