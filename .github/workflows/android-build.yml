name: Manual Android Build

# ðŸ†• Niente trigger automatico - SOLO manual dispatch
on:
  workflow_dispatch:  # Attiva manualmente da GitHub UI
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'corretto'
        cache: gradle
    
    - name: Make gradlew executable
      run: chmod +x gradlew
    
    - name: Build APK (${{ github.event.inputs.build_type }})
      run: ./gradlew assemble${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PortalStreamPro-${{ github.event.inputs.build_type }}-APK
        path: app/build/outputs/apk/${{ github.event.inputs.build_type }}/*.apk
        retention-days: 1
        
